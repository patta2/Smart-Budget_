  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    const KEY='moodeng_data';
    const $=id=>document.getElementById(id);
    const categoryIcons={'อาหาร':'utensils','เดินทาง':'bus-front','เครื่องดื่ม':'coffee','ช้อปปิ้ง':'shopping-bag','การศึกษา':'book-open','บันเทิง':'music','อื่น ๆ':'circle-dot','รายรับ':'wallet'};
    let state={name:'หมูเด้ง',photo:'',theme:'purple',currency:'THB',hidden:false,pin:'',allowance:0,fixed:0,transactions:[],goals:[],recurring:[]};
    let type='expense',pending=null,range='week',sheetRecord=null;
    const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
    const save=async()=>{if(!window.dataSdk)return;let record={name:state.name,photo:state.photo,theme:state.theme,currency:state.currency,hidden:state.hidden,pin:state.pin,allowance:Number(state.allowance)||0,fixed:Number(state.fixed)||0,transactions:JSON.stringify(state.transactions),goals:JSON.stringify(state.goals),recurring:JSON.stringify(state.recurring)};let result=sheetRecord?await window.dataSdk.update({...record,__backendId:sheetRecord.__backendId}):await window.dataSdk.create(record);if(result.isOk&& !sheetRecord) sheetRecord={...record,__backendId:result.data?.__backendId};if(!result.isOk)toast('บันทึกลง Canva Sheet ไม่สำเร็จ กรุณาลองอีกครั้ง')};
    function applySaved(saved){if(saved&&typeof saved==='object'){state={...state,...saved};try{state.transactions=typeof saved.transactions==='string'?JSON.parse(saved.transactions):saved.transactions;state.goals=typeof saved.goals==='string'?JSON.parse(saved.goals):saved.goals;state.recurring=typeof saved.recurring==='string'?JSON.parse(saved.recurring):saved.recurring}catch(e){}if(saved.userName&&!saved.name)state.name=saved.userName;if(Array.isArray(saved.fixedExpenses)&&!state.recurring.length)state.recurring=saved.fixedExpenses.map(x=>({...x,name:x.name||x.title||'รายจ่ายประจำ',paidMonth:x.isPaid?new Date().toISOString().slice(0,7):''}))}state.transactions=Array.isArray(state.transactions)?state.transactions:[];state.goals=Array.isArray(state.goals)?state.goals:[];state.recurring=Array.isArray(state.recurring)?state.recurring:[];$('currency').value=state.currency;setTheme(state.theme,false)}
    function avatar(){return state.photo?'<img src="'+state.photo+'" alt="รูปโปรไฟล์">':'<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M18 29V17c0-6 8-8 12-2l2 4 2-4c4-6 12-4 12 2v12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 34c0-12 8-19 18-19s18 7 18 19v9c0 8-8 13-18 13s-18-5-18-13v-9Z" stroke="currentColor" stroke-linejoin="round"/><path d="M25 36h.01M39 36h.01M28 45c2.6 2 5.4 2 8 0" stroke="currentColor" stroke-linecap="round"/><path d="M23 29h4M37 29h4" stroke="currentColor" stroke-linecap="round"/></svg>'}
    function money(value){if(state.hidden)return '••••••';let c=$('currency').value||'THB';return new Intl.NumberFormat(c==='THB'?'th-TH':'en-US',{style:'currency',currency:c,minimumFractionDigits:c==='JPY'?0:2}).format(Number(value)||0)}
    const signed=(n,t)=>(t==='income'?'+':'-')+money(n);
    function total(items=state.transactions){return items.reduce((a,x)=>{a[x.type]+=(Number(x.amount)||0);return a},{income:0,expense:0})}
    function within(tx,period){const d=new Date(tx.date),now=new Date();if(isNaN(d))return false;if(period==='all')return true;if(period==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();if(period==='year')return d.getFullYear()===now.getFullYear();let start=new Date(now);start.setHours(0,0,0,0);start.setDate(now.getDate()-((now.getDay()+6)%7));return d>=start}
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function icons(){if(window.lucide)lucide.createIcons()}
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
    function setNow(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('txDate').value=d.toISOString().slice(0,16)}
    function txMarkup(x){let d=new Date(x.date);return '<div class="list-item"><div class="cat-icon"><i data-lucide="'+(categoryIcons[x.category]||'circle-dot')+'"></i></div><div class="list-main"><b>'+esc(x.category)+'</b><p class="tiny muted truncate">'+esc(x.memo||'ไม่มีบันทึก')+' · '+(isNaN(d)?'':d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}))+'</p></div><div style="text-align:right"><b class="money '+x.type+'">'+signed(x.amount,x.type)+'</b><button class="delete" type="button" onclick="deleteTx(\''+x.id+'\')">ลบ</button></div></div>'}
    function renderHome(){let t=total(),bal=Number(state.allowance)+t.income-t.expense,now=new Date(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1,week=total(state.transactions.filter(x=>within(x,'week'))).expense,month=total(state.transactions.filter(x=>within(x,'month'))).expense,budget=Math.max(0,Number(state.allowance)||0),used=Math.max(0,t.expense),percent=budget>0?(used/budget)*100:0,status=percent>=100?'over':percent>=90?'low':percent>=70?'near':'plan',statusText=status==='over'?'ใช้เกินงบแล้ว':status==='low'?'เงินใกล้หมดแล้ว':status==='near'?'ใกล้ถึงงบแล้ว':'อยู่ในแผน';$('balanceValue').textContent=money(bal);$('dailyValue').textContent=money(Math.max(0,bal-Number(state.fixed||0))/days);$('weekSpent').textContent=signed(week,'expense');$('monthSpent').textContent=signed(month,'expense');$('gauge').style.width=Math.min(100,Math.max(0,percent))+'%';$('gauge').className='status-'+status;$('budgetStatus').className='budget-status '+status;$('budgetStatusText').textContent=statusText;$('budgetPercent').textContent=Math.round(percent)+'%';$('budgetUsage').textContent='ใช้ไป '+money(used)+' / '+money(budget);$('homeName').textContent=state.name;$('profileName').textContent=state.name;$('allowance').value=state.allowance||'';$('fixed').value=state.fixed||'';let recent=[...state.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);$('recentList').innerHTML=recent.length?recent.map(txMarkup).join(''):'<div class="empty"><i data-lucide="wallet-cards"></i><p>ยังไม่มีรายการ</p><span class="tiny">เริ่มบันทึกเพื่อเห็นภาพการเงิน</span></div>';$('homeAvatar').innerHTML=avatar();$('profileAvatar').innerHTML=avatar();icons()}
    function renderTransactions(){let q=$('search').value.toLowerCase(),cat=$('filterCategory').value,p=$('filterPeriod').value;let data=[...state.transactions].filter(x=>(!q||(x.category+' '+x.memo).toLowerCase().includes(q))&&(!cat||x.category===cat)&&within(x,p)).sort((a,b)=>new Date(b.date)-new Date(a.date));$('txList').innerHTML=data.length?data.map(txMarkup).join(''):'<div class="empty"><i data-lucide="search-x"></i><p>ไม่พบรายการ</p></div>';icons()}
    function renderAnalytics(){let data=state.transactions.filter(x=>within(x,range)),t=total(data),categories={};data.filter(x=>x.type==='expense').forEach(x=>categories[x.category]=(categories[x.category]||0)+Number(x.amount));let ranks=Object.entries(categories).sort((a,b)=>b[1]-a[1]),sum=t.expense||1,colors=['#7056D9','#F43F5E','#0EA5E9','#F59E0B','#10B981','#64748B'],cursor=0,stops=ranks.map(([,v],i)=>{let s=cursor;cursor+=v/sum*100;return colors[i%colors.length]+' '+s+'% '+cursor+'%'});$('donut').style.background=ranks.length?'conic-gradient('+stops.join(',')+')':'#E8EDF2';$('chartSpent').textContent=signed(t.expense,'expense');$('chartIncome').textContent=signed(t.income,'income');$('chartNet').textContent=money(t.income-t.expense);$('rankList').innerHTML=ranks.length?ranks.map(([n,v])=>'<div class="rank"><div class="cat-icon"><i data-lucide="'+(categoryIcons[n]||'circle-dot')+'"></i></div><b class="rank-name">'+esc(n)+'</b><div class="rank-track"><span style="width:'+(v/sum*100)+'%"></span></div><b class="money tiny expense">'+signed(v,'expense')+'</b></div>').join(''):'<div class="empty"><i data-lucide="chart-no-axes-combined"></i><p>ยังไม่มีรายจ่ายในช่วงนี้</p></div>';icons()}
    function renderRecurring(){let month=new Date().toISOString().slice(0,7);$('recurringList').innerHTML=state.recurring.length?state.recurring.map((b,i)=>{let paid=b.paidMonth===month;return '<div class="list-item"><div class="cat-icon"><i data-lucide="repeat"></i></div><div class="list-main"><b>'+esc(b.name)+'</b><p class="tiny muted money">'+money(b.amount)+(paid?' · ชำระแล้ว':'')+'</p></div><button class="'+(paid?'secondary':'primary')+'" type="button" '+(paid?'disabled':'onclick="payRecurring('+i+')"')+'>'+(paid?'ชำระแล้ว':'จ่าย')+'</button></div>'}).join(''):'<div class="empty"><i data-lucide="calendar-clock"></i><p>ยังไม่มีรายจ่ายประจำ</p><span class="tiny">เพิ่มบิลที่ต้องจ่ายทุกเดือนได้ที่นี่</span></div>';icons()}
    function addRecurringBill(){let list=$('recurringList');list.innerHTML='<form id="recurringForm" class="field"><label for="recurringName">ชื่อรายจ่ายประจำ</label><input id="recurringName" class="input" required placeholder="เช่น ค่าเน็ตมือถือ"><label for="recurringAmount">จำนวนเงิน</label><input id="recurringAmount" class="input money" type="number" min="0" step="any" inputmode="decimal"><button class="primary full" type="submit">บันทึกบิล</button></form>'+list.innerHTML;$('recurringForm').addEventListener('submit',e=>{e.preventDefault();let name=$('recurringName').value.trim(),rawValue=$('recurringAmount').value.replace(/,/g,''),amount=parseFloat(rawValue);if(!name||isNaN(amount)||amount<=0)return toast('กรุณากรอกจำนวนเงินเป็นตัวเลขที่มากกว่า 0');state.recurring.push({id:id(),name,amount,paidMonth:''});save();renderRecurring();toast('เพิ่มรายจ่ายประจำแล้ว')})}
    function payRecurring(index){let b=state.recurring[index],month=new Date().toISOString().slice(0,7);if(!b||b.paidMonth===month)return;let amount=Number(b.amount);if(!b.name||!Number.isFinite(amount)||amount<=0)return toast('ข้อมูลรายจ่ายประจำไม่ถูกต้อง');b.paidMonth=month;state.transactions.push({id:id(),type:'expense',category:'ค่าใช้จ่ายประจำ',amount,date:new Date().toISOString(),memo:b.name,receipt:''});save();renderAll();toast('ชำระ '+b.name+' แล้ว')}
    function renderGoals(){$('goalList').innerHTML=state.goals.length?state.goals.map(g=>{let pc=Math.min(100,g.saved/g.amount*100),days=Math.max(1,Math.ceil((new Date(g.date+'T23:59')-new Date())/86400000)),daily=Math.max(0,g.amount-g.saved)/days;return '<div class="goal"><div class="between"><b>'+esc(g.name)+'</b><button class="delete" type="button" onclick="deleteGoal(\''+g.id+'\')">ลบ</button></div><div class="between tiny muted" style="margin-top:3px"><span class="money">'+money(g.saved)+' / '+money(g.amount)+'</span><span>'+Math.round(pc)+'%</span></div><div class="progress"><span style="width:'+pc+'%"></span></div><p class="tiny" style="margin-top:8px">แนะนำเก็บ <b class="money">'+money(daily)+'</b> ต่อวัน</p></div>'}).join(''):'<div class="empty"><i data-lucide="piggy-bank"></i><p>ยังไม่มีกระปุกเป้าหมาย</p></div>';icons()}
    function renderAll(){state.currency=$('currency').value;save();renderHome();renderTransactions();renderAnalytics();renderGoals();renderRecurring();splitBill()}
    function showScreen(screen){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('hidden',x.id!==screen));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===screen));if(screen==='transactions')renderTransactions();if(screen==='analytics')renderAnalytics();if(screen==='profile')renderGoals();window.scrollTo({top:0,behavior:'smooth'})}
    function setType(next){type=next;$('expenseTab').classList.toggle('active',next==='expense');$('incomeTab').classList.toggle('active',next==='income');if(next==='income')$('txCategory').value='รายรับ'}
    function quickAdd(category){showScreen('transactions');setType('expense');$('txCategory').value=category;$('txAmount').focus()}
    $('txForm').addEventListener('submit',e=>{e.preventDefault();let rawValue=$('txAmount').value.replace(/,/g,'');let amount=parseFloat(rawValue);if(isNaN(amount)||amount<=0)return toast('กรุณากรอกจำนวนเงินเป็นตัวเลขที่มากกว่า 0');pending={id:id(),type,category:$('txCategory').value,amount,date:$('txDate').value,memo:$('txMemo').value.trim(),receipt:$('receiptPreview').dataset.image||''};if(type==='expense'&&amount>300)openModal('impulseModal');else saveTransaction()});
    function saveTransaction(){if(!pending)return;state.transactions.push(pending);pending=null;closeModal('impulseModal');$('txForm').reset();$('receiptPreview').style.display='none';$('receiptPreview').dataset.image='';setNow();renderAll();toast('บันทึกรายการแล้ว')}
    function deleteTx(txid){state.transactions=state.transactions.filter(x=>x.id!==txid);renderAll();toast('ลบรายการแล้ว')}
    $('receipt').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('receiptPreview').src=r.result;$('receiptPreview').dataset.image=r.result;$('receiptPreview').style.display='block'};r.readAsDataURL(f)});
    $('search').addEventListener('input',renderTransactions);$('filterCategory').addEventListener('change',renderTransactions);$('filterPeriod').addEventListener('change',renderTransactions);$('currency').addEventListener('change',renderAll);
    $('budgetForm').addEventListener('submit',e=>{e.preventDefault();let allowanceRaw=$('allowance').value.replace(/,/g,''),fixedRaw=$('fixed').value.replace(/,/g,''),allowance=parseFloat(allowanceRaw)||0,fixed=parseFloat(fixedRaw)||0;if(allowance<0||fixed<0)return toast('กรุณากรอกจำนวนเงินเป็นตัวเลขที่ไม่ติดลบ');state.allowance=allowance;state.fixed=fixed;renderAll();toast('บันทึกงบประมาณแล้ว')});
    function setRange(next){range=next;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x.dataset.range===next));renderAnalytics()}
    function openProfile(){$('nameInput').value=state.name;$('avatarUpload').value='';openModal('profileModal')}
    $('avatarUpload').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.photo=r.result;$('profileAvatar').innerHTML=avatar()};r.readAsDataURL(f)});
    function saveProfile(){let name=$('nameInput').value.trim();if(!name)return toast('กรุณาใส่ชื่อ');state.name=name;save();closeModal('profileModal');renderHome();toast('บันทึกโปรไฟล์แล้ว')}
    $('saveNameBtn').addEventListener('click',saveProfile);
    function openModal(mid){$(mid).classList.add('show')} function closeModal(mid){$(mid).classList.remove('show')}
    function saveGoal(){let name=$('goalName').value.trim(),amount=Number($('goalAmount').value),saved=Number($('goalSaved').value)||0,date=$('goalDate').value;if(!name||!amount||!date)return toast('กรอกข้อมูลเป้าหมายให้ครบ');state.goals.push({id:id(),name,amount,saved,date});save();closeModal('goalModal');$('goalName').value='';$('goalAmount').value='';$('goalSaved').value='0';$('goalDate').value='';renderGoals();toast('เพิ่มกระปุกแล้ว')}
    function deleteGoal(gid){state.goals=state.goals.filter(g=>g.id!==gid);save();renderGoals();toast('ลบกระปุกแล้ว')}
    function splitBill(){let all=Number($('billTotal').value)||0,people=Math.max(1,Number($('billPeople').value)||1);$('billEach').textContent=money(all/people)}$('billTotal').addEventListener('input',splitBill);$('billPeople').addEventListener('input',splitBill);
    function savePin(){let pin=$('pinInput').value;if(!/^\d{4}$/.test(pin))return toast('PIN ต้องเป็นตัวเลข 4 หลัก');state.pin=pin;save();closeModal('pinModal');toast('บันทึก PIN แล้ว')}
    function setTheme(theme,store=true){document.body.className=theme;state.theme=theme;document.querySelectorAll('.theme-btn').forEach(x=>x.classList.toggle('active',x.dataset.theme===theme));if(store)save()}
    function toggleMoney(){state.hidden=!state.hidden;save();$('eyeIcon').outerHTML='<i id="eyeIcon" data-lucide="'+(state.hidden?'eye-off':'eye')+'"></i>';renderAll();icons()}
    function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
    function exportCSV(){let rows=[['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','บันทึก'],...state.transactions.map(x=>[x.date,x.type==='income'?'รายรับ':'รายจ่าย',x.category,x.amount,x.memo])];download(new Blob(['\ufeff'+rows.map(row=>row.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'moodeng-report.csv');toast('ส่งออก CSV แล้ว')}
    function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'moodeng-backup.json');toast('สำรองข้อมูลเก็บไว้แล้ว')}
    $('restoreInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.transactions)||!Array.isArray(data.goals))throw new Error();state={...state,...data};$('currency').value=state.currency||'THB';setTheme(state.theme||'purple',false);renderAll();toast('เรียกคืนข้อมูลเดิมแล้ว')}catch(err){toast('ไม่สามารถอ่านไฟล์สำรองนี้ได้')}};r.readAsText(f);e.target.value=''});
    function clearAll(){state={name:'หมูเด้ง',photo:'',theme:state.theme,currency:state.currency,hidden:false,pin:'',allowance:0,fixed:0,transactions:[],goals:[],recurring:[]};save();closeModal('clearModal');renderAll();toast('ล้างข้อมูลทั้งหมดแล้ว')}
    async function initSheet(){
      if(!window.dataSdk){setNow();renderAll();icons();return}
      const handler={onDataChanged(data){if(data.length){sheetRecord=data[0];applySaved(data[0]);renderAll()}else{setNow();renderAll()}icons()}};
      const result=await window.dataSdk.init(handler);
      if(!result.isOk){toast('เชื่อมต่อ Canva Sheet ไม่สำเร็จ');setNow();renderAll();icons();return}
      setNow();renderAll();icons();
    }
    initSheet();
  </script>
 </body>
</html>
