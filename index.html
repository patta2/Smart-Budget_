<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget - บัญชีรับจ่ายสุดน่ารัก</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .hidden { display: none !important; }
        /* Custom Scrollbar for smooth experience */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e9d5ff; border-radius: 4px; }
    </style>
</head>
<body class="bg-purple-50/60 text-gray-700 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[880px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-purple-100">
        
        <!-- Header -->
        <div id="appHeader" class="bg-gradient-to-r from-purple-400 to-pink-400 p-6 text-white rounded-b-3xl shadow-md transition-all duration-500">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <!-- Cute Vector Avatar (Not AI / Not Emoji) -->
                    <div class="w-12 h-12 rounded-full bg-white/20 p-1 border-2 border-white/50 flex items-center justify-center overflow-hidden shadow-inner">
                        <svg viewBox="0 0 36 36" class="w-full h-full fill-pink-100">
                            <path d="M18 2a16 16 0 1016 16A16 16 0 0018 2zm0 4a6 6 0 11-6 6 6 6 0 016-6zm0 22a12 12 0 01-10-5.33 7 7 0 0113.33-2.67h-6.66a5 5 0 00-3.33 1.5A10 10 0 0018 26z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-purple-100 font-light">ยินดีต้อนรับคนเก่ง ✨</p>
                        <h1 class="text-lg font-semibold tracking-wide">Smart Budget</h1>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Toggle Money Eye Button -->
                    <button onclick="toggleMoney()" class="p-2.5 bg-white/20 hover:bg-white/30 rounded-2xl transition shadow-sm" title="ซ่อน/แสดงยอดเงิน">
                        <i id="eyeIcon" data-lucide="eye" class="w-5 h-5 text-white"></i>
                    </button>
                    <!-- Theme Switcher -->
                    <button onclick="switchTheme()" class="p-2.5 bg-white/20 hover:bg-white/30 rounded-2xl transition shadow-sm" title="เปลี่ยนธีมพาสเทล">
                        <i data-lucide="palette" class="w-5 h-5 text-white"></i>
                    </button>
                </div>
            </div>

            <!-- Balance Card -->
            <div class="bg-white/15 backdrop-blur-md rounded-2xl p-4 border border-white/20 mt-4">
                <p class="text-xs text-purple-100 font-medium">ยอดเงินคงเหลือทั้งหมด</p>
                <h2 id="totalBalance" class="text-3xl font-bold mt-1 tracking-tight">฿0.00</h2>
                
                <div class="grid grid-cols-2 gap-4 mt-4 pt-3 border-t border-white/20">
                    <div>
                        <p class="text-[11px] text-purple-100 flex items-center gap-1"><i data-lucide="arrow-down-left" class="w-3.5 h-3.5 text-emerald-200"></i> รายรับรวม</p>
                        <p id="totalIncome" class="text-base font-semibold mt-0.5">฿0.00</p>
                    </div>
                    <div>
                        <p class="text-[11px] text-purple-100 flex items-center gap-1"><i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-rose-200"></i> รายจ่ายรวม</p>
                        <p id="totalExpense" class="text-base font-semibold mt-0.5">฿0.00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-5 pb-28 space-y-6">
            
            <!-- TAB 1: HOME / DASHBOARD -->
            <div id="tabHome" class="space-y-6">
                <!-- Transaction Form Section -->
                <div class="bg-purple-50/40 p-5 rounded-3xl border border-purple-100 shadow-sm">
                    <h3 class="text-sm font-semibold text-purple-900 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4 text-purple-500"></i> บันทึกรายการใหม่
                    </h3>
                    
                    <form id="txForm" onsubmit="handleTxSubmit(event)" class="space-y-4">
                        <!-- ปุ่มสลับ รายรับ / รายจ่าย -->
                        <div class="grid grid-cols-2 gap-3 bg-gray-100 p-1.5 rounded-2xl">
                            <button type="button" id="incomeTab" onclick="switchType('income')" class="py-2.5 rounded-xl font-medium text-sm transition-all duration-300 text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2">
                                <i data-lucide="arrow-down-left" class="w-4 h-4"></i> รายรับ
                            </button>
                            <button type="button" id="expenseTab" onclick="switchType('expense')" class="py-2.5 rounded-xl font-medium text-sm transition-all duration-300 bg-white text-rose-500 shadow-sm flex items-center justify-center gap-2">
                                <i data-lucide="arrow-up-right" class="w-4 h-4"></i> รายจ่าย
                            </button>
                        </div>

                        <!-- จำนวนเงิน -->
                        <div class="field">
                            <label class="block text-xs font-medium text-gray-500 mb-2">จำนวนเงิน (บาท)</label>
                            <input id="txAmount" type="number" min="0.01" step="any" inputmode="decimal" placeholder="0.00" class="w-full text-2xl font-semibold text-gray-700 bg-white border border-gray-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-300 text-center shadow-inner" required>
                        </div>

                        <!-- ตัวเลือกหมวดหมู่ -->
                        <div class="field">
                            <label class="block text-xs font-medium text-gray-500 mb-2">เลือกหมวดหมู่</label>
                            <div id="categoryContainer" class="grid grid-cols-3 gap-2"></div>
                        </div>

                        <!-- ช่องระบุเอง -->
                        <div id="customCategoryBox" class="field hidden">
                            <label class="block text-xs font-medium text-gray-500 mb-2">ระบุชื่อหมวดหมู่</label>
                            <input type="text" id="customInput" placeholder="พิมพ์ชื่อรายการที่นี่..." class="w-full text-sm bg-white border border-gray-200 rounded-2xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-300">
                        </div>

                        <!-- วันที่และเวลา (ซ่อนไว้รองรับระบบ) -->
                        <input id="txDate" type="hidden">
                        <textarea id="txMemo" style="display:none;"></textarea>

                        <!-- ปุ่มบันทึก -->
                        <button type="submit" class="w-full py-3.5 bg-purple-500 hover:bg-purple-600 text-white font-medium rounded-2xl shadow-md transition duration-200 flex items-center justify-center gap-2 mt-2 cursor-pointer">
                            <i data-lucide="check" class="w-5 h-5"></i> บันทึกรายการ
                        </button>
                    </form>
                </div>

                <!-- Recent Transactions -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-gray-800 flex items-center gap-2">
                            <i data-lucide="clock" class="w-4 h-4 text-purple-500"></i> ประวัติรายการล่าสุด
                        </h3>
                        <button onclick="clearAllData()" class="text-xs text-rose-400 hover:text-rose-600 font-medium">ล้างข้อมูลทั้งหมด</button>
                    </div>
                    <div id="txList" class="space-y-2.5">
                        <!-- รายการจะถูกแทรกที่นี่ผ่าน JS -->
                    </div>
                </div>
            </div>

            <!-- TAB 2: ANALYTICS & BUDGET -->
            <div id="tabAnalytics" class="hidden space-y-6">
                <div class="bg-purple-50/40 p-5 rounded-3xl border border-purple-100 shadow-sm">
                    <h3 class="text-sm font-semibold text-purple-900 mb-4 flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-4 h-4 text-purple-500"></i> วิเคราะห์รายจ่ายตามหมวดหมู่
                    </h3>
                    <div id="analyticsList" class="space-y-3">
                        <!-- ข้อมูลวิเคราะห์ -->
                    </div>
                </div>

                <!-- Budget Setting Section -->
                <div class="bg-white p-5 rounded-3xl border border-purple-100 shadow-sm">
                    <h3 class="text-sm font-semibold text-purple-900 mb-3 flex items-center gap-2">
                        <i data-lucide="shield-alert" class="w-4 h-4 text-purple-500"></i> ตั้งงบประมาณรายจ่ายต่อเดือน
                    </h3>
                    <div class="flex gap-2">
                        <input id="monthlyBudgetInput" type="number" placeholder="ระบุงบสูงสุด (บาท)" class="flex-1 text-sm bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-300">
                        <button onclick="saveBudget()" class="px-4 py-2.5 bg-purple-500 text-white rounded-2xl text-sm font-medium hover:bg-purple-600 transition">บันทึก</button>
                    </div>
                    <div id="budgetStatus" class="mt-4 text-xs text-gray-500"></div>
                </div>
            </div>

            <!-- TAB 3: GOALS & TOOLS (Savings / Bill Splitter) -->
            <div id="tabTools" class="hidden space-y-6">
                <!-- Savings Goal -->
                <div class="bg-purple-50/40 p-5 rounded-3xl border border-purple-100 shadow-sm space-y-3">
                    <h3 class="text-sm font-semibold text-purple-900 flex items-center gap-2">
                        <i data-lucide="target" class="w-4 h-4 text-purple-500"></i> เป้าหมายเงินออม
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="goalName" type="text" placeholder="ชื่อเป้าหมาย (เช่น ซื้อไอแพด)" class="text-xs bg-white border border-gray-200 rounded-xl px-3 py-2.5">
                        <input id="goalTarget" type="number" placeholder="ยอดเงินเป้าหมาย" class="text-xs bg-white border border-gray-200 rounded-xl px-3 py-2.5">
                    </div>
                    <button onclick="saveGoal()" class="w-full py-2 bg-purple-500 text-white text-xs font-medium rounded-xl hover:bg-purple-600 transition">ตั้งเป้าหมาย</button>
                    <div id="goalDisplay" class="pt-2"></div>
                </div>

                <!-- Bill Splitter -->
                <div class="bg-white p-5 rounded-3xl border border-purple-100 shadow-sm space-y-3">
                    <h3 class="text-sm font-semibold text-purple-900 flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-purple-500"></i> หารบิลกับเพื่อน
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="splitTotal" type="number" placeholder="ยอดบิลรวม (บาท)" class="text-xs bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5">
                        <input id="splitPeople" type="number" placeholder="จำนวนคน" class="text-xs bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5">
                    </div>
                    <button onclick="calculateSplit()" class="w-full py-2 bg-pink-500 text-white text-xs font-medium rounded-xl hover:bg-pink-600 transition">คำนวณยอดจ่ายต่อคน</button>
                    <div id="splitResult" class="text-center text-sm font-bold text-purple-700 pt-2"></div>
                </div>
            </div>

            <!-- TAB 4: SETTINGS & BACKUP -->
            <div id="tabSettings" class="hidden space-y-6">
                <div class="bg-purple-50/40 p-5 rounded-3xl border border-purple-100 shadow-sm space-y-4">
                    <h3 class="text-sm font-semibold text-purple-900 flex items-center gap-2">
                        <i data-lucide="database" class="w-4 h-4 text-purple-500"></i> สำรองและกู้คืนข้อมูล
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="flex-1 py-2.5 bg-white border border-purple-200 text-purple-700 rounded-2xl text-xs font-medium hover:bg-purple-50 transition flex items-center justify-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i> ส่งออกข้อมูล
                        </button>
                        <label class="flex-1 py-2.5 bg-purple-500 text-white rounded-2xl text-xs font-medium hover:bg-purple-600 transition flex items-center justify-center gap-1.5 cursor-pointer shadow-sm">
                            <i data-lucide="upload" class="w-4 h-4"></i> นำเข้าข้อมูล
                            <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                        </label>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-purple-100 px-6 py-3 flex justify-around items-center shadow-lg">
            <button onclick="switchTab('Home')" id="navHome" class="flex flex-col items-center gap-1 text-purple-600 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">หน้าแรก</span>
            </button>
            <button onclick="switchTab('Analytics')" id="navAnalytics" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
                <i data-lucide="pie-chart" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">วิเคราะห์</span>
            </button>
            <button onclick="switchTab('Tools')" id="navTools" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
                <i data-lucide="target" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">เป้าหมาย</span>
            </button>
            <button onclick="switchTab('Settings')" id="navSettings" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">ตั้งค่า</span>
            </button>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentType = 'expense';
        let selectedCategory = '';
        let isMoneyHidden = false;
        let currentThemeIndex = 0;
        
        const themes = [
            { from: 'from-purple-400', to: 'to-pink-400' },
            { from: 'from-emerald-400', to: 'to-teal-500' },
            { from: 'from-amber-400', to: 'to-orange-400' },
            { from: 'from-rose-400', to: 'to-pink-500' }
        ];

        const categories = {
            expense: ['อาหาร', 'เดินทาง', 'ช้อปปิ้ง', 'บิล/ค่าน้ำไฟ', 'บันเทิง', 'อื่นๆ'],
            income: ['เงินเดือน', 'โบนัส', 'ขายของ', 'เงินค่าขนม', 'อื่นๆ']
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            switchType('expense');
            loadAppData();
            lucide.createIcons();
        });

        // Tab Switcher
        function switchTab(tabName) {
            ['Home', 'Analytics', 'Tools', 'Settings'].forEach(t => {
                document.getElementById(`tab${t}`).classList.add('hidden');
                document.getElementById(`nav${t}`).className = "flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition";
            });
            document.getElementById(`tab${tabName}`).classList.remove('hidden');
            document.getElementById(`nav${tabName}`).className = "flex flex-col items-center gap-1 text-purple-600 font-semibold transition";
            
            if (tabName === 'Analytics') renderAnalytics();
            if (tabName === 'Tools') loadGoal();
            lucide.createIcons();
        }

        // Switch Income / Expense Type
        function switchType(type) {
            currentType = type;
            const incomeTab = document.getElementById('incomeTab');
            const expenseTab = document.getElementById('expenseTab');
            
            if (type === 'income') {
                incomeTab.className = "py-2.5 rounded-xl font-medium text-sm transition-all duration-300 bg-white text-emerald-600 shadow-sm flex items-center justify-center gap-2";
                expenseTab.className = "py-2.5 rounded-xl font-medium text-sm transition-all duration-300 text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2";
            } else {
                expenseTab.className = "py-2.5 rounded-xl font-medium text-sm transition-all duration-300 bg-white text-rose-500 shadow-sm flex items-center justify-center gap-2";
                incomeTab.className = "py-2.5 rounded-xl font-medium text-sm transition-all duration-300 text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2";
            }
            renderCategories();
        }

        // Render Categories Buttons
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';
            const list = categories[currentType];
            
            list.forEach((cat, index) => {
                const btn = document.createElement('button');
                const isSelected = selectedCategory === cat || (index === 0 && !selectedCategory);
                if (index === 0 && !selectedCategory) selectedCategory = cat;

                btn.type = 'button';
                btn.className = `py-2 px-3 text-xs font-medium rounded-xl border transition-all text-center truncate ${
                    isSelected ? 'bg-purple-100 border-purple-300 text-purple-700 shadow-sm' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
                }`;
                btn.innerText = cat;
                btn.onclick = () => {
                    selectedCategory = cat;
                    document.getElementById('customCategoryBox').classList.add('hidden');
                    renderCategories();
                };
                container.appendChild(btn);
            });

            if (selectedCategory === 'อื่นๆ') {
                document.getElementById('customCategoryBox').classList.remove('hidden');
            }
        }

        // Handle Form Submission
        function handleTxSubmit(event) {
            event.preventDefault();
            const amountInput = document.getElementById('txAmount');
            const amount = parseFloat(amountInput.value);
            
            if (!amount || amount <= 0) return;

            let finalCategory = selectedCategory;
            if (selectedCategory === 'อื่นๆ') {
                const customVal = document.getElementById('customInput').value.trim();
                if (customVal) finalCategory = customVal;
            }

            const newTx = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: finalCategory,
                date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })
            };

            let txs = JSON.parse(localStorage.getItem('smart_budget_txs') || '[]');
            txs.unshift(newTx);
            localStorage.setItem('smart_budget_txs', JSON.stringify(txs));

            amountInput.value = '';
            document.getElementById('customInput').value = '';
            loadAppData();
        }

        // Load and Display All App Data
        function loadAppData() {
            const txs = JSON.parse(localStorage.getItem('smart_budget_txs') || '[]');
            const listContainer = document.getElementById('txList');
            listContainer.innerHTML = '';

            let totalInc = 0;
            let totalExp = 0;

            if (txs.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">ยังไม่มีรายการบันทึกในขณะนี้ ✨</div>`;
            }

            txs.forEach(tx => {
                if (tx.type === 'income') totalInc += tx.amount;
                else totalExp += tx.amount;

                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3.5 bg-white border border-gray-100 rounded-2xl shadow-xs hover:shadow-md transition";
                
                const formattedAmount = isMoneyHidden ? '฿••••••' : `฿${tx.amount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
                const amountColor = tx.type === 'income' ? 'text-emerald-500' : 'text-gray-700';

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl flex items-center justify-center ${tx.type === 'income' ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500'}">
                            <i data-lucide="${tx.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">${tx.category}</p>
                            <p class="text-[11px] text-gray-400">${tx.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold ${amountColor}">${tx.type === 'income' ? '+' : '-'}${formattedAmount}</span>
                        <button onclick="deleteTx(${tx.id})" class="text-gray-300 hover:text-rose-500 transition p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            const netBalance = totalInc - totalExp;
            document.getElementById('totalBalance').innerText = isMoneyHidden ? '฿••••••' : `฿${netBalance.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
            document.getElementById('totalIncome').innerText = isMoneyHidden ? '฿••••••' : `฿${totalInc.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
            document.getElementById('totalExpense').innerText = isMoneyHidden ? '฿••••••' : `฿${totalExp.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;

            checkBudgetStatus(totalExp);
            lucide.createIcons();
        }

        // Delete Single Transaction
        function deleteTx(id) {
            let txs = JSON.parse(localStorage.getItem('smart_budget_txs') || '[]');
            txs = txs.filter(tx => tx.id !== id);
            localStorage.setItem('smart_budget_txs', JSON.stringify(txs));
            loadAppData();
        }

        // Clear All Data
        function clearAllData() {
            if (confirm('คุณต้องการล้างประวัติทั้งหมดใช่หรือไม่?')) {
                localStorage.removeItem('smart_budget_txs');
                loadAppData();
            }
        }

        // Toggle Money Visibility (Eye Icon Fix)
        function toggleMoney() {
            isMoneyHidden = !isMoneyHidden;
            const eyeIcon = document.getElementById('eyeIcon');
            eyeIcon.setAttribute('data-lucide', isMoneyHidden ? 'eye-off' : 'eye');
            loadAppData();
        }

        // Switch Pastel Themes
        function switchTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const t = themes[currentThemeIndex];
            const header = document.getElementById('appHeader');
            header.className = `bg-gradient-to-r ${t.from} ${t.to} p-6 text-white rounded-b-3xl shadow-md transition-all duration-500`;
        }

        // Analytics Logic
        function renderAnalytics() {
            const txs = JSON.parse(localStorage.getItem('smart_budget_txs') || '[]');
            const container = document.getElementById('analyticsList');
            container.innerHTML = '';
            
            const expenses = txs.filter(t => t.type === 'expense');
            const summary = {};
            let totalExp = 0;

            expenses.forEach(t => {
                summary[t.category] = (summary[t.category] || 0) + t.amount;
                totalExp += t.amount;
            });

            if (Object.keys(summary).length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">ยังไม่มีข้อมูลรายจ่ายสำหรับวิเคราะห์</p>`;
                return;
            }

            for (let [cat, amount] of Object.entries(summary)) {
                const percent = totalExp > 0 ? ((amount / totalExp) * 100).toFixed(1) : 0;
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-2xl border border-gray-100 shadow-xs space-y-1.5";
                div.innerHTML = `
                    <div class="flex justify-between text-xs font-semibold text-gray-700">
                        <span>${cat}</span>
                        <span>฿${amount.toLocaleString()} (${percent}%)</span>
                    </div>
                    <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                        <div class="bg-purple-400 h-full rounded-full" style="width: ${percent}%"></div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        // Budget Logic
        function saveBudget() {
            const val = document.getElementById('monthlyBudgetInput').value;
            localStorage.setItem('smart_budget_limit', val);
            loadAppData();
            alert('บันทึกงบประมาณเรียบร้อยแล้ว!');
        }

        function checkBudgetStatus(totalExp) {
            const limit = parseFloat(localStorage.getItem('smart_budget_limit'));
            const statusDiv = document.getElementById('budgetStatus');
            if (!limit || !statusDiv) return;

            const diff = limit - totalExp;
            if (diff >= 0) {
                statusDiv.innerHTML = `<span class="text-emerald-600 font-medium">เหลือวงเงินงบประมาณอีก ฿${diff.toLocaleString()} เดือนนี้</span>`;
            } else {
                statusDiv.innerHTML = `<span class="text-rose-500 font-semibold">⚠️ ใช้เกินงบประมาณไปแล้ว ฿${Math.abs(diff).toLocaleString()}!</span>`;
            }
        }

        // Savings Goal Logic
        function saveGoal() {
            const name = document.getElementById('goalName').value;
            const target = parseFloat(document.getElementById('goalTarget').value);
            if (!name || !target) return;
            localStorage.setItem('smart_goal', JSON.stringify({ name, target }));
            loadGoal();
            alert('ตั้งเป้าหมายสำเร็จ!');
        }

        function loadGoal() {
            const goal = JSON.parse(localStorage.getItem('smart_goal'));
            const display = document.getElementById('goalDisplay');
            if (!goal || !display) return;
            
            display.innerHTML = `
                <div class="bg-white p-3 rounded-xl border border-purple-100 text-xs space-y-1">
                    <p class="font-semibold text-purple-900">🎯 เป้าหมาย: ${goal.name}</p>
                    <p class="text-gray-500">เป้าหมายสูงสุด: ฿${goal.target.toLocaleString()}</p>
                </div>
            `;
        }

        // Bill Splitter
        function calculateSplit() {
            const total = parseFloat(document.getElementById('splitTotal').value);
            const people = parseInt(document.getElementById('splitPeople').value);
            const res = document.getElementById('splitResult');
            if (!total || !people || people <= 0) return;
            const perPerson = total / people;
            res.innerText = `จ่ายคนละ: ฿${perPerson.toFixed(2)} บาท`;
        }

        // Export/Import Backup
        function exportData() {
            const data = JSON.stringify(localStorage);
            const blob = new Blob([data], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `smart_budget_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    for (let key in data) {
                        localStorage.setItem(key, data[key]);
                    }
                    loadAppData();
                    alert('นำเข้าข้อมูลสำเร็จ!');
                } catch (err) {
                    alert('ไฟล์ไม่ถูกต้อง!');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
